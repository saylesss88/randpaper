[package]
name = "randpaper_lib"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Render a wallpaper image onto a Wayland output using zwlr_layer_shell_v1. No swaybg, no swww, pure Rust Wayland plumbing with a single blocking function call."
keywords = ["wayland", "wallpaper", "layer-shell", "wlroots", "compositor"]

[lib]
name = "randpaper_lib"
path = "src/lib.rs"

[dependencies]
image = {workspace = true, optional = true}
rustix = {version = "1.1.4", default-features = false, optional = true}
smithay-client-toolkit = {workspace = true, optional = true}
thiserror = {version = "2.0.19", default-features = false}
wayland-client = {workspace = true, optional = true}
log.workspace = true

[features]
default = ["native-renderer"]
native-renderer = [
	"dep:smithay-client-toolkit",
	"dep:wayland-client",
	"dep:rustix",
	"dep:image",
]
