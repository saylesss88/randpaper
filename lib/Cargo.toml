[package]
name = "randpaper_lib"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Render a wallpaper image onto a Wayland output using zwlr_layer_shell_v1. No swaybg, no swww, pure Rust Wayland plumbing with a single blocking function call."
keywords = ["wayland", "wallpaper", "layer-shell", "wlroots", "compositor"]

[lib]
name = "randpaper_lib"
path = "src/lib.rs"

[dependencies]
image.workspace = true
rustix = "1.1.4"
smithay-client-toolkit.workspace = true
thiserror = {version = "2.0.18", default-features = false}
wayland-client.workspace = true
log.workspace = true
