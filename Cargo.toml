[workspace]
members = ["lib", "cli", "ipc"]
default-members = ["lib", "cli", "ipc"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
description = "A customizable wallpaper daemon for per-monitor cycling, one-shot application, and optional theme synchronization for Waybar and terminals."
readme = "README.md"
authors = ["T. Sawyer <saylesss87@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/saylesss88/randpaper"
homepage = "https://github.com/saylesss88/randpaper"
keywords = ["rust", "wallpaper"]
categories = ["command-line-utilities", "multimedia"]
exclude = [
	"assets/*",
	"*.mp4",
	"*.gif",
	".github",
	".gitignore",
	"flake",
	"flake.lock",
	"flake.nix",
	"result",
	"rustfmt.toml",
	"node_modules/*",
	"package-lock.json",
	"package.json",
]

[workspace.dependencies]
anyhow = {version = "1.0.102", default-features = false}
async-trait = "0.1.89"
clap = {version = "4.6.1", features = ["derive"]}
color-thief = "0.2.2"
dirs = "6.0.0"
env_logger = {version = "0.11.10", default-features = false}
figment = {version = "0.10.19", features = ["env", "toml"]}
fslock = "0.2.1"
humantime = "2.3.0"
image = {version = "0.25.10", default-features = false, features = [
	"jpeg",
	"png",
]}
log = "0.4.32"
rand = "0.10.1"
serde = {version = "1.0.228", default-features = false}
serde_json = "1.0.150"
smithay-client-toolkit = {version = "0.20.0", default-features = false}
swayipc-async = "3.0.0"
tokio = {version = "1.52.3", features = [
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
]}
walkdir = "2.5.0"
wayland-client = "0.31.14"
xdg = "3.0.0"
randpaper_lib = {path = "lib", version = "0.1.0"}
randpaper_ipc = {path = "ipc", version = "0.1.0"}

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}
rust_2018_idioms = {level = "warn", priority = -1}

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}
# missing_const_for_fn = "allow"
cargo = {level = "warn", priority = -1}

unwrap_used = "warn" # Forces you to use .expect() or handle errors
expect_used = "warn"
todo = "warn"        # Prevents accidental commits of unfinished code
dbg_macro = "warn"   # Ensures no debug print statements leak to production
panic = "warn"       # Warns on code that can panic

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = 'abort'
strip = true
